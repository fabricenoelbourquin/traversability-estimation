# Motor constants (R, k_t, G) are loaded from config/metrics.private.yaml (gitignored).
metrics:
  names:
    - speed_error_abs
    - power_mech
    - power_joule_heating
    - power
    - cost_of_transport
    - cost_of_transport_mech
    - joint_travel_rate_L1
#    - joint_travel_cum_L1
    - torque_L1_rate
    - power_mech_signed
#    - energy_pos_cum
#    - cot_running
  cumulative:
#    - joint_travel_cum_L1
#    - energy_pos_cum
#    - cot_running
  separate_output: true 

# Parameters for speed and command speed filtering and normalization for COT
params:
  max_speed_mps: 1
  min_speed_for_power_norm: 0.1     # > 1e-4
  min_cmd_speed_for_power_norm: 0.2
  min_cmd_speed_pad_s: 2            # mark samples within this time of sub-threshold cmd speed as invalid
  turn_only_min_w_cmd_z: 0.4        # rad/s; consider commands above this as turning
  turn_only_max_v_cmd_for_turn: 0.6 # m/s; commands below this + above min_w considered turn-in-place
  turn_only_pad_s: 3              # seconds padding around turn-in-place commands

dem_pitch_roll:
  # DEM pitch/roll along trajectory, computed once per sample and aggregated per patch.
  # pitch and roll are calculated from smoothed DEM gradients and bilinear interpolation along trajectory, filtered and averaged to add to dataset.
  smooth_scales_m: [0.5, 1.5, 3.5]  # Gaussian sigma in meters (converted to pixels via DEM resolution)
  filter_params:
    smooth_window: 5                 # rolling median window for pitch/roll samples
    mad_z_thresh: 3.5                # global MAD z-score outlier rejection (on entire traj)
    rate_hampel_filter: true         # enable spike suppression on DEM pitch/roll values
    rate_hampel_max_rate: 5.0        # max pitch/roll rate [deg/s] for spike suppression
    rate_hampel_window: 101          # Hampel filter window (samples)
    rate_hampel_z: 2.0               # Hampel MAD z-threshold
    value_gauss_sigma: 10.0          # Gaussian smoothing sigma (samples) for values
  gps_yaw:
    process_var: 1.0                 # acceleration noise variance for Kalman CV model
    meas_var: 1.0                    # GPS position variance (m^2)
    init_pos_var: 10.0               # initial position variance
    init_vel_var: 1.0                # initial velocity variance
    min_speed_mps: 0.05              # below this, yaw samples are ignored before smoothing

robot:
  mass_kg: 50.0      
  gravity: 9.81

filters:
  # leave default as pass-through so only explicitly listed signals are smoothed
  default:
    type: none

  speed_error_abs:
    - type: moving_median  # suppress single-frame spikes
      window: 5
    - type: moving_average # smooth residual jitter
      window: 35

  speed_tracking_score:
    type: moving_average
    window: 25

  joint_travel_rate_L1:
    - type: moving_median
      window: 5
    - type: moving_average
      window: 35

  torque_L1_rate:
    - type: moving_median
      window: 7
    - type: moving_average
      window: 45
  
  power_mech:
    - type: moving_median
      window: 5
    - type: moving_average
      window: 25
  
  power_mech_signed:
    - type: moving_median
      window: 5
    - type: moving_average
      window: 25

  power_joule_heating:
    - type: moving_median
      window: 5
    - type: moving_average
      window: 25

  power:
    - type: moving_median
      window: 5
    - type: moving_average
      window: 25

  cost_of_transport_speed:
    - type: hampel
      window: 101
      k: 3.0
    - type: moving_median
      window: 5
    - type: moving_average
      window: 15

  cost_of_transport_power:
    - type: moving_median
      window: 1
    - type: moving_average
      window: 1

  cost_of_transport:
    - type: hampel
      window: 101
      k: 3.0
    - type: moving_median
      window: 7
    - type: moving_average
      window: 35

  dem_pitch_roll_gps_yaw:
    - type: moving_median
      window: 5
    - type: moving_average
      window: 25
    - type: rate_limit
      max_rate_deg_s: 45.0

  dem_pitch_roll_gps_speed:
    - type: moving_median
      window: 5
    - type: moving_average
      window: 15
